# Posts the report built by sdrf-change-report.yml as a sticky PR comment with sdrf:* labels.
# workflow_run gives this job a write token (and secrets) even for fork PRs, so it never checks
# out or runs PR code: scripts come from the default branch and the artifact is treated as data.
# Like every workflow_run workflow, it only takes effect once it is on the default branch.
name: SDRF change comment

on:
  workflow_run:
    workflows: ["SDRF change report"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sdrf-change-report
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for report
        id: check
        run: |
          if [ -f artifact/report.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No report artifact (PR touched no dataset SDRFs)."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.present == 'true'
        with:
          python-version: '3.11'

      - name: Add AI-generated summaries
        if: steps.check.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not configured; skipping summaries."
            exit 0
          fi
          python -m pip install --quiet "anthropic>=1,<2"
          python .github/scripts/sdrf_change_llm.py artifact/report.json

      - name: Post comment and labels
        if: steps.check.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python .github/scripts/sdrf_change_post.py artifact/report.json
