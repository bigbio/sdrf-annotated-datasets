# Builds an advisory report of what a PR changes in dataset SDRFs: new and deleted datasets,
# and for existing datasets the grouped value changes, ontology relations, risk levels and
# quality delta. Runs with read-only permissions and no secrets because it executes PR code;
# sdrf-change-comment.yml picks up the uploaded report and posts it.
#
# Not path-filtered on purpose: when a later push reverts every SDRF change, this run finishes
# without an artifact and the comment job clears the earlier report and labels.
name: SDRF change report

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed SDRF files
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Three-dot diff: only what the PR introduces relative to the merge-base.
          git -c core.quotepath=off diff --name-status --no-renames --diff-filter=AMD \
            "$BASE...$HEAD" > name-status.txt
          count=$(grep -cE $'^[AMD]\tdatasets/.+\\.sdrf(\\.tsv)?$' name-status.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Dataset SDRF files changed: $count"

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.count != '0'
        with:
          python-version: '3.11'

      - name: Install sdrf-pipelines from GitHub (main)
        if: steps.changed.outputs.count != '0'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --upgrade "git+https://github.com/bigbio/sdrf-pipelines.git@main"

      - name: Snapshot base versions of modified and deleted files
        if: steps.changed.outputs.count != '0'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r status path; do
            case "$status" in
              M|D)
                mkdir -p ".base/$(dirname "$path")"
                git show "$BASE:$path" > ".base/$path"
                ;;
            esac
          done < name-status.txt

      - name: Build change report
        if: steps.changed.outputs.count != '0'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/sdrf_change_report.py \
            --name-status name-status.txt --base-dir .base --out out/report.json \
            --pr "$PR_NUMBER" --head-sha "$HEAD" --base-sha "$BASE"

      # Summaries come from a small model running on the runner's CPU: no API key, and no
      # data leaves the runner. Ollama is started only when a PR modifies or deletes datasets.
      - name: Add AI-generated summaries (local model)
        if: steps.changed.outputs.count != '0'
        env:
          OLLAMA_IMAGE: ollama/ollama:0.34.1
          SDRF_SUMMARY_MODEL: qwen2.5:3b
        run: |
          set -euo pipefail
          [ -f out/report.json ] || exit 0
          n=$(python .github/scripts/sdrf_change_llm.py count out/report.json)
          if [ "$n" = "0" ]; then
            echo "No modified or deleted datasets; skipping summaries."
            exit 0
          fi
          docker run -d --name ollama -p 127.0.0.1:11434:11434 "$OLLAMA_IMAGE"
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/version >/dev/null && break
            sleep 2
          done
          docker exec ollama ollama pull "$SDRF_SUMMARY_MODEL" \
            || { echo "Model pull failed; skipping summaries."; exit 0; }
          OLLAMA_HOST=http://127.0.0.1:11434 \
            python .github/scripts/sdrf_change_llm.py summarize out/report.json

      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.count != '0'
        with:
          name: sdrf-change-report
          path: out/report.json
          if-no-files-found: ignore
          retention-days: 30
